services:
  - type: web
    name: veytrix-crm
    runtime: docker
    plan: free
    region: oregon
    branch: main
    rootDir: SalesManagementSystem
    dockerfilePath: Dockerfile
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "Veytrix"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false # Set to your Render URL e.g. https://veytrix-crm.onrender.com
      - key: APP_KEY
        sync: false # Set to your 32-character key from local .env
      - key: DB_CONNECTION
        value: mongodb
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string with 0.0.0.0/0 whitelist
      - key: MONGODB_DATABASE
        value: salesmanagementsystem

      # Sessions: 'cookie' stores encrypted session in client browser, surviving Render Free container spin-downs
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_ENCRYPT
        value: "true"

      - key: CACHE_STORE
        value: array
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: log

      # Email: Brevo SMTP on port 2525 (NOT blocked by Render Free — only 25, 465, 587 are blocked)
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_SCHEME
        value: tls
      - key: MAIL_USERNAME
        value: arhamarifali722@gmail.com
      - key: MAIL_PASSWORD
        sync: false # Paste your Brevo SMTP API key from: Brevo Dashboard → Settings → SMTP & API
      - key: MAIL_FROM_ADDRESS
        value: arhamarifali722@gmail.com
      - key: MAIL_FROM_NAME
        value: "Veytrix"
      - key: AUTH_PASSWORD_RESET_EXPIRE
        value: "3"
