services:
  - type: web
    name: veytrix-crm
    runtime: docker
    plan: free
    region: oregon
    branch: main
    rootDir: SalesManagementSystem
    dockerfilePath: Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "Veytrix"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_URL
        sync: false # Set to your Render URL e.g. https://veytrix-crm.onrender.com
      - key: APP_KEY
        sync: false # Set to your 32-character key from local .env
      - key: DB_CONNECTION
        value: mongodb
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string with 0.0.0.0/0 whitelist
      - key: MONGODB_DATABASE
        value: salesmanagementsystem

      # Sessions: 'cookie' stores encrypted session in client browser, surviving Render Free container spin-downs
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_ENCRYPT
        value: "true"

      - key: CACHE_STORE
        value: array
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: log

      # Email: Brevo HTTPS REST API (bypasses Render Free SMTP port 587 block over HTTPS port 443)
      - key: MAIL_MAILER
        value: brevo
      - key: BREVO_API_KEY
        sync: false # Paste your Brevo API key in Render Dashboard
      - key: BREVO_FROM_EMAIL
        value: arhamarifali722@gmail.com
      - key: BREVO_FROM_NAME
        value: "Veytrix"
      - key: MAIL_FROM_ADDRESS
        value: arhamarifali722@gmail.com
      - key: MAIL_FROM_NAME
        value: "Veytrix"
      - key: AUTH_PASSWORD_RESET_EXPIRE
        value: "3"
